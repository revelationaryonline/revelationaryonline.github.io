</head><body style="overflow-y:scroll"><template data-public-root="start"></template><div id="root"><header class="reader-startup"><a href="/" aria-label="Revelationary home"><img src="/static/media/revelationary-logo-compact.b6f176cc6416b8baa2f2.webp" alt="Revelationary" width="376" height="82"></a></header><article><h1>Psalms 124 — 和合本 Chinese Union Version (CUV)</h1><p><span>1</span> （大衛 上行 之詩。）以色列 人要 說：若不是 耶和華 幫助 我們，</p><p><span>2</span> 若不是 耶和華 幫助 我們，當人 起來 攻擊我們、</p><p><span>3</span> 向我們 發 怒的時候，就 把我們活活地 吞了。</p><p><span>4</span> 那時，波濤 必漫過我們，河水 必淹 沒 我們，</p><p><span>5</span> 狂傲的 水 必淹 沒 我們。</p><p><span>6</span> 耶和華 是應當稱頌的！他沒有 把我們當野食 交給他們吞吃（原文是牙齒）。</p><p><span>7</span> 我們 好像雀鳥，從捕鳥人 的網羅 裡逃脫；網羅 破裂，我們 逃脫了。</p><p><span>8</span> 我們得幫助，是在乎倚靠造 天 地 之耶和華 的名。</p></article></div><template data-public-root="end"></template></body></html>
