</head><body style="overflow-y:scroll"><template data-public-root="start"></template><div id="root"><header class="reader-startup"><a href="/" aria-label="Revelationary home"><img src="/static/media/revelationary-logo-compact.b6f176cc6416b8baa2f2.webp" alt="Revelationary" width="376" height="82"></a></header><article><h1>Psalms 13 — 和合本 Chinese Union Version (CUV)</h1><p><span>1</span> （大衛的 詩，交與伶長。）耶和華啊，你忘記我 要到 幾時呢？要到永遠嗎？你掩 面 不顧我 要到 幾時呢？</p><p><span>2</span> 我心裡 籌 算，終日 愁苦，要到 幾時呢？我的仇敵 升高 壓制我，要到 幾時呢？</p><p><span>3</span> 耶和華─我的　神啊，求你看顧我，應允我！使我眼目 光明，免得 我沉睡 至死；</p><p><span>4</span> 免得 我的仇敵 說：我勝了他；免得我的敵人 在我搖動 的時候 喜樂。</p><p><span>5</span> 但我 倚靠 你的慈愛；我的心 因你的救恩 快樂。</p><p><span>6</span> 我要向耶和華 歌唱，因 他用厚恩 待我。</p></article></div><template data-public-root="end"></template></body></html>
